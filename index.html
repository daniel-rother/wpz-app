function gpsToSvg(lat,lng){
  const x=(lng-ZOO_BOUNDS.lngMin)/(ZOO_BOUNDS.lngMax-ZOO_BOUNDS.lngMin);
  const y=1-(lat-ZOO_BOUNDS.latMin)/(ZOO_BOUNDS.latMax-ZOO_BOUNDS.latMin);
  return{x:Math.max(0.02,Math.min(0.98,x)),y:Math.max(0.02,Math.min(0.98,y))};
}
function gpsToZone(lat,lng){
  for(const[zone,[latMin,latMax,lngMin,lngMax]]of Object.entries(ZONE_GPS)){
    if(lat>=latMin&&lat<=latMax&&lng>=lngMin&&lng<=lngMax)return zone;
  }
  let closest=null,minDist=Infinity;
  for(const[zone,[latMin,latMax,lngMin,lngMax]]of Object.entries(ZONE_GPS)){
    const d=Math.hypot(lat-(latMin+latMax)/2,lng-(lngMin+lngMax)/2);
    if(d<minDist){minDist=d;closest=zone;}
  }
  return closest;
}

function hitZoneSvg(rx,ry,W,H){
  // rx,ry are 0-1 fractions of the SVG viewbox
  const px=rx*400, py=ry*480;
  // Check each zone polygon
  for(const z of ZONE_DEFS){
    // Simple bbox check from the path d
    const nums=z.d.match(/-?\d+\.?\d*/g).map(Number);
    const xs=nums.filter((_,i)=>i%2===0);
    const ys=nums.filter((_,i)=>i%2!==0);
    const xMin=Math.min(...xs),xMax=Math.max(...xs);
    const yMin=Math.min(...ys),yMax=Math.max(...ys);
    if(px>=xMin&&px<=xMax&&py>=yMin&&py<=yMax)return z.id;
  }
  return null;
}

function dbGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}}
function dbSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
function calcAge(bd){const d=new Date(bd),n=new Date();let y=n.getFullYear()-d.getFullYear();if(n.getMonth()-d.getMonth()<0||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate()))y--;return y;}
function fmtDate(d){return new Date(d+"T00:00:00").toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});}

function AnimalCard({a,compact}){
  const[exp,setExp]=useState(false);
  return(
    <div onClick={()=>setExp(e=>!e)} style={{background:"white",borderRadius:14,padding:"12px 14px",marginBottom:10,boxShadow:"0 2px 8px rgba(0,0,0,0.08)",borderLeft:`4px solid ${WPZ_GREEN}`,cursor:"pointer"}}>

        <div><div style={{fontWeight:800,fontSize:17,color:"#1b5e20"}}>{a.name}</div><div style={{fontSize:13,color:"#555",marginTop:1}}>{a.species}</div></div>
        <div style={{fontSize:13,background:WPZ_GREEN,color:"white",borderRadius:12,padding:"3px 9px",flexShrink:0}}>{ZONE_EMOJI[a.zone]}</div>
      </div>
      <div style={{display:"flex",gap:12,marginTop:7,fontSize:13,color:"#444",flexWrap:"wrap"}}>
        <span>{a.gender==="Female"?"♀":a.gender==="Male"?"♂":"⚥"} {a.gender}</span>
        <span>🎂 {calcAge(a.birthdate)} yrs</span>
        <span style={{color:"#999"}}>{fmtDate(a.birthdate)}</span>
      </div>
      {!compact&&<div style={{marginTop:5,fontSize:12,color:"#888"}}>{ZONE_EMOJI[a.zone]} {a.zone}</div>}
      {exp&&(a.blog||a.wiki)&&(
        <div style={{marginTop:10,display:"flex",gap:8,flexWrap:"wrap"}} onClick={e=>e.stopPropagation()}>
          {a.blog&&<a href={a.blog} target="_blank" rel="noreferrer" style={{fontSize:12,background:"#e8f5e9",color:WPZ_GREEN,borderRadius:8,padding:"5px 10px",textDecoration:"none",fontWeight:"bold",border:`1px solid ${WPZ_GREEN}`}}>📖 Zoo Blog</a>}
          {a.wiki&&<a href={a.wiki} target="_blank" rel="noreferrer" style={{fontSize:12,background:"#f5f5f5",color:"#333",borderRadius:8,padding:"5px 10px",textDecoration:"none",fontWeight:"bold",border:"1px solid #ccc"}}>🔍 Wikipedia</a>}
        </div>
      )}
      {exp&&!a.blog&&!a.wiki&&<div style={{marginTop:8,fontSize:12,color:"#aaa"}}>No links available.</div>}
      <div style={{textAlign:"right",fontSize:11,color:"#bbb",marginTop:4}}>{exp?"▲ collapse":"▼ tap for links"}</div>
    </div>
  );
}

// SVG Map drawn to match the 2026 official WPZ map layout
function ZoneMap({selectedZone,onZoneSelect,gpsCoords}){
  const VW=400,VH=480;
  const gpsSvg=gpsCoords?gpsToSvg(gpsCoords.lat,gpsCoords.lng):null;

  return(
    <div style={{width:"100%",overflowX:"hidden"}}>
    <svg width="100%" viewBox={`0 0 ${VW} ${VH}`} style={{borderRadius:16,boxShadow:"0 3px 16px rgba(0,0,0,0.18)",display:"block",background:"#c8dfc8"}}>
      {/* Outer border / park grounds */}
      <rect x="0" y="0" width={VW} height={VH} rx="16" fill="#c8dfc8"/>

      {/* Zone polygons */}
      {ZONE_DEFS.map(z=>{
        const sel=selectedZone===z.id;
        return(
          <g key={z.id} onClick={()=>onZoneSelect(z.id===selectedZone?null:z.id)} style={{cursor:"pointer"}}>
            <path d={z.d} fill={z.color} opacity={sel?1:0.78}
              stroke={sel?"white":"rgba(255,255,255,0.6)"} strokeWidth={sel?3:1.5} strokeLinejoin="round"/>
          </g>
        );
      })}

      {/* Path lines suggesting walkways */}
      <g stroke="rgba(255,255,255,0.45)" strokeWidth="2" strokeDasharray="6,4" fill="none">
        {/* Main loop rough path */}
        <path d="M 75,420 L 75,200 L 200,200 L 200,160 L 320,160 L 320,310 L 200,310 L 200,420 Z"/>
      </g>

      {/* Zone labels */}
      {ZONE_DEFS.map(z=>{
        const pos=ZONE_LABEL_POS[z.id];
        const sel=selectedZone===z.id;
        const words=z.id.split(" ");
        const lines=[];let cur="";
        words.forEach(w=>{if((cur+" "+w).trim().length>13&&cur){lines.push(cur.trim());cur=w;}else{cur=(cur+" "+w).trim();}});
        if(cur)lines.push(cur);
        return(
          <g key={z.id+"lbl"} onClick={()=>onZoneSelect(z.id===selectedZone?null:z.id)} style={{cursor:"pointer"}}>
            {/* Label background pill */}
            <rect x={pos.x-52} y={pos.y-10*(lines.length)-4} width={104} height={lines.length*16+8} rx="6"
              fill={sel?"rgba(0,0,0,0.45)":"rgba(0,0,0,0.28)"}/>
            {lines.map((line,i)=>(
              <text key={i} x={pos.x} y={pos.y+(i-(lines.length-1)/2)*16}
                textAnchor="middle" dominantBaseline="middle"
                fontSize={sel?11:10} fontWeight="bold" fill="white"
                style={{pointerEvents:"none"}}>
                {ZONE_EMOJI[z.id]} {line}
              </text>
            ))}
          </g>
        );
      })}

      {/* Entrances */}
      <g fontSize="9" fill="#333" textAnchor="middle">
        <rect x="42" y="428" width="66" height="22" rx="4" fill="white" opacity="0.85"/>
        <text x="75" y="443" fontWeight="bold">🚪 West Entrance</text>
        <rect x="252" y="448" width="76" height="22" rx="4" fill="white" opacity="0.85"/>
        <text x="290" y="463" fontWeight="bold">🚪 South Entrance</text>
      </g>

      {/* N compass */}
      <g>
        <circle cx={VW-24} cy={28} r={18} fill="white" opacity="0.85"/>
        <text x={VW-24} y={22} textAnchor="middle" fontSize="8" fill="#333">N</text>
        <text x={VW-24} y={32} textAnchor="middle" fontSize="13">▲</text>
      </g>

      {/* GPS dot */}
      {gpsSvg&&(
        <g style={{pointerEvents:"none"}}>
          <circle cx={gpsSvg.x*VW} cy={gpsSvg.y*VH} r={18} fill="#1565c0" opacity={0.18}/>
          <circle cx={gpsSvg.x*VW} cy={gpsSvg.y*VH} r={10} fill="#1565c0" opacity={0.32}/>
          <circle cx={gpsSvg.x*VW} cy={gpsSvg.y*VH} r={6}  fill="#1976d2" stroke="white" strokeWidth={2.5}/>
          <rect x={gpsSvg.x*VW-14} y={gpsSvg.y*VH-26} width={28} height={14} rx="4" fill="rgba(21,101,192,0.85)"/>
          <text x={gpsSvg.x*VW} y={gpsSvg.y*VH-16} textAnchor="middle" fontSize="9" fill="white" fontWeight="bold">You</text>
        </g>
      )}

      {/* Footer note */}
      <rect x="0" y={VH-20} width={VW} height={20} rx="0" fill="rgba(0,0,0,0.18)"/>
      <text x={VW/2} y={VH-7} textAnchor="middle" fontSize="9" fill="white">Tap any zone to see nearby animals</text>
    </svg>
    </div>
  );
}

export default function App(){
  const[screen,setScreen]=useState("login");
  const[pw,setPw]=useState("");const[pwErr,setPwErr]=useState("");const[loginMode,setLoginMode]=useState("volunteer");
  const[animals,setAnimals]=useState([]);
  const[activeTab,setActiveTab]=useState("list");
  const[selectedZone,setSelectedZone]=useState(null);
  const[search,setSearch]=useState("");
  const[gpsCoords,setGpsCoords]=useState(null);
  const[gpsStatus,setGpsStatus]=useState("idle");
  const[toast,setToast]=useState("");
  const[editAnimal,setEditAnimal]=useState(null);
  const[form,setForm]=useState({name:"",species:"",gender:"Female",birthdate:"",zone:ZONES[0],blog:"",wiki:""});
  const[adminSearch,setAdminSearch]=useState("");
  const watchRef=useRef(null);

  useEffect(()=>{const s=dbGet("wpz_animals2");setAnimals(s&&s.length>0?s:INITIAL_ANIMALS);},[]);
  useEffect(()=>{if(animals.length>0)dbSet("wpz_animals2",animals);},[animals]);
  useEffect(()=>()=>{if(watchRef.current)navigator.geolocation.clearWatch(watchRef.current);},[]);

  function showToast(m){setToast(m);setTimeout(()=>setToast(""),3000);}

  function startGPS(){
    if(!navigator.geolocation){showToast("GPS not supported on this device.");return;}
    setGpsStatus("loading");
    watchRef.current=navigator.geolocation.watchPosition(
      pos=>{
        const{latitude:lat,longitude:lng}=pos.coords;
        setGpsCoords({lat,lng});
        const zone=gpsToZone(lat,lng);
        setGpsStatus("found");
        if(zone){setSelectedZone(zone);}
        else setGpsStatus("outside");
      },
      ()=>{setGpsStatus("error");showToast("Couldn't get location. Enable location services and try again.");},
      {enableHighAccuracy:true,maximumAge:5000,timeout:12000}
    );
  }
  function stopGPS(){
    if(watchRef.current){navigator.geolocation.clearWatch(watchRef.current);watchRef.current=null;}
    setGpsCoords(null);setGpsStatus("idle");
  }
  function handleLogin(){
    if(loginMode==="volunteer"&&pw===VOLUNTEER_PASSWORD){setScreen("volunteer");setPwErr("");setPw("");}
    else if(loginMode==="admin"&&pw===ADMIN_PASSWORD){setScreen("admin");setPwErr("");setPw("");}
    else setPwErr("Incorrect password. Please try again.");
  }
  function handleLogout(){stopGPS();setScreen("login");setSelectedZone(null);setSearch("");}

  const volAnimals=animals.filter(a=>{
    const inZone=!selectedZone||a.zone===selectedZone;
    const q=search.toLowerCase();
    return inZone&&(!search||a.name.toLowerCase().includes(q)||a.species.toLowerCase().includes(q));
  });
  const adminAnimals=animals.filter(a=>{
    const q=adminSearch.toLowerCase();
    return !adminSearch||a.name.toLowerCase().includes(q)||a.species.toLowerCase().includes(q)||a.zone.toLowerCase().includes(q);
  });

  function startAdd(){setForm({name:"",species:"",gender:"Female",birthdate:"",zone:ZONES[0],blog:"",wiki:""});setEditAnimal(null);setScreen("adminEdit");}
  function startEdit(a){setForm({name:a.name,species:a.species,gender:a.gender,birthdate:a.birthdate,zone:a.zone,blog:a.blog||"",wiki:a.wiki||""});setEditAnimal(a);setScreen("adminEdit");}
  function saveAnimal(){
    if(!form.name||!form.species||!form.birthdate)return;
    const entry={...form,blog:form.blog||null,wiki:form.wiki||null};
    if(editAnimal){setAnimals(p=>p.map(a=>a.id===editAnimal.id?{...a,...entry}:a));showToast("Animal updated!");}
    else{setAnimals(p=>[...p,{id:Math.max(...p.map(a=>a.id))+1,...entry}]);showToast("Animal added!");}
    setScreen("admin");
  }
  function deleteAnimal(id){setAnimals(p=>p.filter(a=>a.id!==id));showToast("Animal removed.");}

  const inp={width:"100%",padding:"10px 12px",borderRadius:8,border:"1.5px solid #c8e6c9",fontSize:15,boxSizing:"border-box",fontFamily:"inherit",outline:"none",marginBottom:10,background:"white"};
  const btnG={background:WPZ_GREEN,color:"white",border:"none",borderRadius:8,padding:"12px 0",fontSize:15,fontWeight:"bold",cursor:"pointer",width:"100%"};
  const btnO={background:"white",color:WPZ_GREEN,border:`2px solid ${WPZ_GREEN}`,borderRadius:8,padding:"10px 0",fontSize:14,fontWeight:"bold",cursor:"pointer",width:"100%",marginTop:8};

  const GpsButton=()=>{
    if(gpsStatus==="loading")return(<button disabled style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,background:"#90a4ae",color:"white",border:"none",borderRadius:10,padding:"11px 0",fontSize:14,fontWeight:"bold",width:"100%",marginBottom:12}}>⏳ Getting location...</button>);
    if(gpsStatus==="found")return(<button onClick={stopGPS} style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,background:"#1565c0",color:"white",border:"none",borderRadius:10,padding:"11px 0",fontSize:14,fontWeight:"bold",cursor:"pointer",width:"100%",marginBottom:12}}>🔵 Tracking — Tap to Stop</button>);
    return(<button onClick={startGPS} style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,background:"#1565c0",color:"white",border:"none",borderRadius:10,padding:"11px 0",fontSize:14,fontWeight:"bold",cursor:"pointer",width:"100%",marginBottom:12}}>📍 Find My Location</button>);
  };

  if(screen==="login")return(
    <div style={{minHeight:"100vh",background:WPZ_GREEN,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:"white",borderRadius:20,padding:"32px 28px",maxWidth:360,width:"100%",textAlign:"center",boxShadow:"0 8px 32px rgba(0,0,0,0.2)"}}>
        <div style={{display:"flex",justifyContent:"center",marginBottom:14}}>
          <img src={LOGO_URL} alt="Woodland Park Zoo" style={{height:80,objectFit:"contain"}} onError={e=>e.target.style.display="none"}/>
        </div>
        <div style={{fontWeight:900,fontSize:20,color:WPZ_GREEN,marginBottom:4}}>Woodland Park Zoo</div>
        <div style={{fontSize:13,color:"#666",marginBottom:20}}>Volunteer Animal Directory</div>
        <div style={{display:"flex",marginBottom:16,borderRadius:8,overflow:"hidden",border:`1.5px solid ${WPZ_GREEN}`}}>
          {["volunteer","admin"].map(m=>(
            <button key={m} onClick={()=>setLoginMode(m)} style={{flex:1,padding:"9px 0",fontSize:13,fontWeight:"bold",cursor:"pointer",border:"none",background:loginMode===m?WPZ_GREEN:"white",color:loginMode===m?"white":WPZ_GREEN}}>
              {m==="volunteer"?"🙋 Volunteer":"🔧 Admin"}
            </button>
          ))}
        </div>
        <input type="password" placeholder={`${loginMode==="volunteer"?"Volunteer":"Admin"} password`} value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleLogin()} style={inp}/>
        {pwErr&&<div style={{color:"#c62828",fontSize:13,marginBottom:8}}>{pwErr}</div>}
        <button onClick={handleLogin} style={btnG}>Sign In</button>
        <div style={{marginTop:16,fontSize:11,color:"#aaa"}}>Internal use only — Woodland Park Zoo</div>
      </div>
    </div>
  );

  if(screen==="volunteer")return(
    <div style={{minHeight:"100vh",background:"#f4faf4"}}>
      {toast&&<div style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",background:"#333",color:"white",padding:"10px 22px",borderRadius:20,zIndex:999,fontWeight:"bold",fontSize:14,whiteSpace:"nowrap"}}>{toast}</div>}
      <div style={{background:WPZ_GREEN,padding:"12px 16px",display:"flex",alignItems:"center",gap:10,position:"sticky",top:0,zIndex:10}}>
        <img src={LOGO_URL} alt="WPZ" style={{height:36,objectFit:"contain"}} onError={e=>e.target.style.display="none"}/>
        <div style={{flex:1}}><div style={{color:"white",fontWeight:800,fontSize:15}}>WPZ Animal Directory</div><div style={{color:"#a5d6a7",fontSize:11}}>Volunteer Access</div></div>
        <button onClick={handleLogout} style={{background:"rgba(255,255,255,0.15)",border:"none",color:"white",borderRadius:8,padding:"6px 12px",fontSize:12,cursor:"pointer"}}>Sign Out</button>
      </div>
      <div style={{display:"flex",background:"white",borderBottom:"2px solid #e0e0e0"}}>
        {[["list","📋 Animals"],["map","🗺️ Map"]].map(([tab,label])=>(
          <button key={tab} onClick={()=>setActiveTab(tab)} style={{flex:1,padding:"11px 0",fontSize:13,fontWeight:"bold",border:"none",cursor:"pointer",background:"transparent",color:activeTab===tab?WPZ_GREEN:"#999",borderBottom:activeTab===tab?`3px solid ${WPZ_GREEN}`:"3px solid transparent"}}>{label}</button>
        ))}
      </div>

      {activeTab==="map"&&(
        <div style={{padding:"14px 16px 80px"}}>
          <GpsButton/>
          {gpsStatus==="found"&&selectedZone&&<div style={{fontSize:13,color:"#1b5e20",marginBottom:10,textAlign:"center",background:"#e8f5e9",borderRadius:8,padding:"8px"}}>🔵 You are in: <strong>{selectedZone}</strong></div>}
          {gpsStatus==="outside"&&<div style={{fontSize:13,color:"#bf360c",marginBottom:10,textAlign:"center",background:"#fbe9e7",borderRadius:8,padding:"8px"}}>📍 Your location appears to be outside the zoo</div>}
          <ZoneMap selectedZone={selectedZone} onZoneSelect={z=>{setSelectedZone(z);}} gpsCoords={gpsCoords}/>
          {selectedZone&&(
            <div style={{marginTop:14}}>
              <div style={{fontWeight:800,fontSize:16,color:WPZ_GREEN,marginBottom:6}}>{ZONE_EMOJI[selectedZone]} {selectedZone}</div>
              <div style={{fontSize:13,color:"#666",marginBottom:10}}>{volAnimals.length} animal{volAnimals.length!==1?"s":""} — tap a card for links</div>
              {volAnimals.map(a=><AnimalCard key={a.id} a={a} compact/>)}
              <button onClick={()=>{setSelectedZone(null);if(gpsStatus==="found")stopGPS();}} style={{...btnO,marginTop:4}}>Clear Selection</button>
            </div>
          )}
          {!selectedZone&&(
            <div style={{marginTop:12}}>
              <div style={{fontSize:13,color:"#888",marginBottom:8,textAlign:"center"}}>Or tap a zone below</div>
              {ZONES.map(z=>{const cnt=animals.filter(a=>a.zone===z).length;const zd=ZONE_DEFS.find(p=>p.id===z);return(
                <div key={z} onClick={()=>setSelectedZone(z)} style={{display:"flex",alignItems:"center",gap:10,background:"white",borderRadius:10,padding:"10px 14px",marginBottom:8,cursor:"pointer",boxShadow:"0 1px 4px rgba(0,0,0,0.07)"}}>
                  <div style={{width:16,height:16,borderRadius:4,background:zd?.color,flexShrink:0}}/>
                  <div style={{flex:1,fontWeight:600,fontSize:14}}>{ZONE_EMOJI[z]} {z}</div>
                  <div style={{fontSize:13,color:"#888"}}>{cnt} animals</div>
                </div>
              );})}
            </div>
          )}
        </div>
      )}

      {activeTab==="list"&&(
        <div style={{padding:"14px 16px 80px"}}>
          <GpsButton/>
          {gpsStatus==="found"&&selectedZone&&<div style={{fontSize:13,color:"#1b5e20",marginBottom:10,textAlign:"center",background:"#e8f5e9",borderRadius:8,padding:"8px"}}>🔵 Nearest zone: <strong>{selectedZone}</strong></div>}
          <input placeholder="🔍 Search by name or species..." value={search} onChange={e=>{setSearch(e.target.value);setSelectedZone(null);}} style={{...inp,border:"1.5px solid #c8e6c9"}}/>
          <div style={{display:"flex",gap:8,overflowX:"auto",paddingBottom:8,marginBottom:8}}>
            <button onClick={()=>{setSelectedZone(null);setSearch("");}} style={{flexShrink:0,padding:"7px 14px",borderRadius:20,border:"none",cursor:"pointer",fontSize:12,fontWeight:"bold",background:!selectedZone?WPZ_GREEN:"#e0e0e0",color:!selectedZone?"white":"#555"}}>All</button>
            {ZONES.map(z=>(<button key={z} onClick={()=>{setSelectedZone(z);setSearch("");}} style={{flexShrink:0,padding:"7px 12px",borderRadius:20,border:"none",cursor:"pointer",fontSize:12,fontWeight:"bold",background:selectedZone===z?WPZ_GREEN:"#e0e0e0",color:selectedZone===z?"white":"#555"}}>{ZONE_EMOJI[z]}</button>))}
          </div>
          {selectedZone&&<div style={{fontSize:13,color:WPZ_GREEN,fontWeight:"bold",marginBottom:8}}>{ZONE_EMOJI[selectedZone]} {selectedZone}</div>}
          <div style={{fontSize:12,color:"#888",marginBottom:8}}>{volAnimals.length} animal{volAnimals.length!==1?"s":""} — tap any card for links</div>
          {volAnimals.length===0&&<div style={{textAlign:"center",color:"#aaa",marginTop:40}}>No animals found.</div>}
          {volAnimals.map(a=><AnimalCard key={a.id} a={a} compact={!!selectedZone}/>)}
        </div>
      )}
    </div>
  );

  if(screen==="admin")return(
    <div style={{minHeight:"100vh",background:"#f4faf4"}}>
      {toast&&<div style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",background:"#2e7d32",color:"white",padding:"10px 24px",borderRadius:20,zIndex:999,fontWeight:"bold",fontSize:14}}>{toast}</div>}
      <div style={{background:"#1b5e20",padding:"12px 16px",display:"flex",alignItems:"center",gap:10,position:"sticky",top:0,zIndex:10}}>
        <img src={LOGO_URL} alt="WPZ" style={{height:36,objectFit:"contain"}} onError={e=>e.target.style.display="none"}/>
        <div style={{flex:1}}><div style={{color:"white",fontWeight:800,fontSize:15}}>Admin Panel</div><div style={{color:"#a5d6a7",fontSize:11}}>Animal Management</div></div>
        <button onClick={handleLogout} style={{background:"rgba(255,255,255,0.15)",border:"none",color:"white",borderRadius:8,padding:"6px 12px",fontSize:12,cursor:"pointer"}}>Sign Out</button>
      </div>
      <div style={{padding:"14px 16px 80px"}}>
        <button onClick={startAdd} style={{...btnG,marginBottom:12}}>+ Add New Animal</button>
        <input placeholder="🔍 Search animals..." value={adminSearch} onChange={e=>setAdminSearch(e.target.value)} style={{...inp,marginBottom:12}}/>
        <div style={{fontSize:13,color:"#666",marginBottom:8}}>{adminAnimals.length} animals total</div>
        {adminAnimals.map(a=>(
          <div key={a.id} style={{background:"white",borderRadius:12,padding:"12px 14px",marginBottom:8,boxShadow:"0 2px 6px rgba(0,0,0,0.07)",borderLeft:`4px solid ${WPZ_GREEN}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div>
                <div style={{fontWeight:800,fontSize:16,color:"#1b5e20"}}>{a.name}</div>
                <div style={{fontSize:13,color:"#555"}}>{a.species} · {a.gender} · {calcAge(a.birthdate)} yrs</div>
                <div style={{fontSize:12,color:"#888",marginTop:2}}>{ZONE_EMOJI[a.zone]} {a.zone}</div>
              </div>
              <div style={{display:"flex",gap:6,flexShrink:0}}>
                <button onClick={()=>startEdit(a)} style={{background:WPZ_GOLD,border:"none",color:"white",borderRadius:7,padding:"6px 12px",fontSize:12,fontWeight:"bold",cursor:"pointer"}}>Edit</button>
                <button onClick={()=>deleteAnimal(a.id)} style={{background:"#e53935",border:"none",color:"white",borderRadius:7,padding:"6px 10px",fontSize:12,fontWeight:"bold",cursor:"pointer"}}>✕</button>
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );

  return(
    <div style={{minHeight:"100vh",background:"#f4faf4"}}>
      <div style={{background:"#1b5e20",padding:"12px 16px",display:"flex",alignItems:"center",gap:10}}>
        <button onClick={()=>setScreen("admin")} style={{background:"rgba(255,255,255,0.15)",border:"none",color:"white",borderRadius:8,padding:"6px 10px",fontSize:14,cursor:"pointer"}}>←</button>
        <div style={{color:"white",fontWeight:800,fontSize:16}}>{editAnimal?"Edit Animal":"Add New Animal"}</div>
      </div>
      <div style={{padding:"20px 16px"}}>
        {[["Name","name","Animal name"],["Species","species","e.g. Western Lowland Gorilla"],["Zoo Blog URL","blog","https://blog.zoo.org/..."],["Wikipedia URL","wiki","https://en.wikipedia.org/wiki/..."]].map(([label,field,ph])=>(
          <div key={field}><label style={{fontSize:13,color:"#555",fontWeight:"bold"}}>{label}</label><input value={form[field]} onChange={e=>setForm(f=>({...f,[field]:e.target.value}))} placeholder={ph} style={inp}/></div>
        ))}
        <label style={{fontSize:13,color:"#555",fontWeight:"bold"}}>Gender</label>
        <select value={form.gender} onChange={e=>setForm(f=>({...f,gender:e.target.value}))} style={inp}><option>Female</option><option>Male</option><option>Unknown</option></select>
        <label style={{fontSize:13,color:"#555",fontWeight:"bold"}}>Birthdate</label>
        <input type="date" value={form.birthdate} onChange={e=>setForm(f=>({...f,birthdate:e.target.value}))} style={inp}/>
        <label style={{fontSize:13,color:"#555",fontWeight:"bold"}}>Zone</label>
        <select value={form.zone} onChange={e=>setForm(f=>({...f,zone:e.target.value}))} style={inp}>{ZONES.map(z=><option key={z}>{z}</option>)}</select>
        <button onClick={saveAnimal} style={{...btnG,marginTop:8}} disabled={!form.name||!form.species||!form.birthdate}>{editAnimal?"Save Changes":"Add Animal"}</button>
        <button onClick={()=>setScreen("admin")} style={btnO}>Cancel</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
