// Convert real GPS to SVG 0-1 coordinates
function gpsToSvg(lat, lng) {
  const x = (lng - ZOO_BOUNDS.lngMin) / (ZOO_BOUNDS.lngMax - ZOO_BOUNDS.lngMin);
  // lat is inverted: higher lat = top of map (lower y)
  const y = 1 - (lat - ZOO_BOUNDS.latMin) / (ZOO_BOUNDS.latMax - ZOO_BOUNDS.latMin);
  return { x: Math.max(0.02, Math.min(0.98, x)), y: Math.max(0.02, Math.min(0.98, y)) };
}

// Find which zone a GPS coordinate falls in
function gpsToZone(lat, lng) {
  for (const [zone, [latMin, latMax, lngMin, lngMax]] of Object.entries(ZONE_GPS)) {
    if (lat >= latMin && lat <= latMax && lng >= lngMin && lng <= lngMax) return zone;
  }
  // If not in any zone exactly, find the closest one
  let closest = null, minDist = Infinity;
  for (const [zone, [latMin, latMax, lngMin, lngMax]] of Object.entries(ZONE_GPS)) {
    const centerLat = (latMin + latMax) / 2;
    const centerLng = (lngMin + lngMax) / 2;
    const dist = Math.hypot(lat - centerLat, lng - centerLng);
    if (dist < minDist) { minDist = dist; closest = zone; }
  }
  return closest;
}

function dbGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}}
function dbSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
function calcAge(bd){const d=new Date(bd),n=new Date();let y=n.getFullYear()-d.getFullYear();if(n.getMonth()-d.getMonth()<0||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate()))y--;return y;}
function fmtDate(d){return new Date(d+"T00:00:00").toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});}
function hitZone(rx,ry){
  for(const z of ZONE_PATHS){
    const pts=z.d.replace(/[MLZ]/g,"").trim().split(/\s+/).filter(Boolean).map(p=>{const[a,b]=p.split(",");return[parseFloat(a),parseFloat(b)];});
    let inside=false;
    for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[xi,yi]=pts[i],[xj,yj]=pts[j];if(((yi>ry)!==(yj>ry))&&(rx<(xj-xi)*(ry-yi)/(yj-yi)+xi))inside=!inside;}
    if(inside)return z.id;
  }
  return null;
}

function ZoneMap({selectedZone,onZoneSelect,pinCoords,gpsCoords}){
  const W=340,H=300;
  const gpsSvg = gpsCoords ? gpsToSvg(gpsCoords.lat, gpsCoords.lng) : null;
  return(
    <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{borderRadius:14,boxShadow:"0 2px 12px rgba(0,0,0,0.15)",display:"block"}}>
      <rect width={W} height={H} fill="#d8ecd4" rx="14"/>
      {ZONE_PATHS.map(z=>{
        const pts=z.d.replace(/[ML]/g,"").trim().split(/\s+Z?\s*/).filter(Boolean).map(p=>{const[a,b]=p.split(",");return`${parseFloat(a)*W},${parseFloat(b)*H}`;}).join(" ");
        const sel=selectedZone===z.id;
        return(<g key={z.id} onClick={e=>{e.stopPropagation();onZoneSelect(z.id===selectedZone?null:z.id);}} style={{cursor:"pointer"}}>
          <polygon points={pts} fill={z.color} opacity={sel?1:0.72} stroke={sel?"#fff":"rgba(255,255,255,0.5)"} strokeWidth={sel?2.5:1}/>
        </g>);
      })}
      {ZONE_LABELS.map(z=>{
        const words=z.id.split(" ");let cur="";const lines=[];
        words.forEach(w=>{if((cur+" "+w).length>12&&cur){lines.push(cur);cur=w;}else{cur=cur?cur+" "+w:w;}});
        if(cur)lines.push(cur);
        const sel=selectedZone===z.id;
        return(<g key={z.id} onClick={()=>onZoneSelect(z.id===selectedZone?null:z.id)} style={{cursor:"pointer"}}>
          {lines.map((line,i)=>(
            <text key={i} x={z.x*W} y={z.y*H+(i-(lines.length-1)/2)*11} textAnchor="middle" fontSize={sel?9:8} fontWeight="bold" fill="white" style={{pointerEvents:"none",filter:"drop-shadow(0 1px 1px rgba(0,0,0,0.5))"}}>
              {line}
            </text>
          ))}
        </g>);
      })}
      {/* Manual pin */}
      {pinCoords&&!gpsCoords&&(
        <g style={{pointerEvents:"none"}}>
          <circle cx={pinCoords.x*W} cy={pinCoords.y*H} r={10} fill="#e53935" stroke="white" strokeWidth={2.5}/>
          <text x={pinCoords.x*W} y={pinCoords.y*H+4} textAnchor="middle" fontSize="10" fill="white">📍</text>
        </g>
      )}
      {/* GPS location dot — blue pulsing dot */}
      {gpsSvg&&(
        <g style={{pointerEvents:"none"}}>
          <circle cx={gpsSvg.x*W} cy={gpsSvg.y*H} r={14} fill="#1565c0" opacity={0.2}/>
          <circle cx={gpsSvg.x*W} cy={gpsSvg.y*H} r={8}  fill="#1565c0" opacity={0.35}/>
          <circle cx={gpsSvg.x*W} cy={gpsSvg.y*H} r={5}  fill="#1976d2" stroke="white" strokeWidth={2}/>
          <text x={gpsSvg.x*W} y={gpsSvg.y*H-16} textAnchor="middle" fontSize="9" fill="#1565c0" fontWeight="bold" style={{filter:"drop-shadow(0 1px 1px white)"}}>You</text>
        </g>
      )}
      <text x={W-14} y={22} fontSize={11} fill="#555" textAnchor="middle">N</text>
      <text x={W-14} y={14} fontSize={7}  fill="#555" textAnchor="middle">▲</text>
      <text x={10} y={H-8} fontSize={8} fill="#666">Tap a zone to filter animals</text>
    </svg>
  );
}

function App(){
  const[screen,setScreen]=useState("login");
  const[pw,setPw]=useState("");const[pwErr,setPwErr]=useState("");const[loginMode,setLoginMode]=useState("volunteer");
  const[animals,setAnimals]=useState([]);
  const[activeTab,setActiveTab]=useState("list");
  const[selectedZone,setSelectedZone]=useState(null);
  const[search,setSearch]=useState("");
  const[pinCoords,setPinCoords]=useState(null);
  const[gpsCoords,setGpsCoords]=useState(null);
  const[gpsStatus,setGpsStatus]=useState("idle"); // idle | loading | found | error | outside
  const[toast,setToast]=useState("");
  const[editAnimal,setEditAnimal]=useState(null);
  const[form,setForm]=useState({name:"",species:"",gender:"Female",birthdate:"",zone:ZONES[0],blog:"",wiki:""});
  const[adminSearch,setAdminSearch]=useState("");
  const watchRef = useRef(null);

  useEffect(()=>{
    const saved=dbGet("wpz_animals");
    setAnimals(saved&&saved.length>0?saved:INITIAL_ANIMALS);
  },[]);
  useEffect(()=>{if(animals.length>0)dbSet("wpz_animals",animals);},[animals]);

  // Clean up GPS watch on unmount
  useEffect(()=>()=>{if(watchRef.current)navigator.geolocation.clearWatch(watchRef.current);},[]);

  function startGPS(){
    if(!navigator.geolocation){setGpsStatus("error");showToast("GPS not supported on this device.");return;}
    setGpsStatus("loading");
    watchRef.current = navigator.geolocation.watchPosition(
      pos=>{
        const{latitude:lat,longitude:lng}=pos.coords;
        setGpsCoords({lat,lng});
        const zone=gpsToZone(lat,lng);
        setGpsStatus("found");
        if(zone){setSelectedZone(zone);setActiveTab("list");}
        else setGpsStatus("outside");
      },
      ()=>{setGpsStatus("error");showToast("Couldn't get your location. Make sure location is enabled.");},
      {enableHighAccuracy:true,maximumAge:5000,timeout:10000}
    );
  }

  function stopGPS(){
    if(watchRef.current){navigator.geolocation.clearWatch(watchRef.current);watchRef.current=null;}
    setGpsCoords(null);setGpsStatus("idle");
  }

  function showToast(m){setToast(m);setTimeout(()=>setToast(""),3000);}
  function handleLogin(){
    if(loginMode==="volunteer"&&pw===VOLUNTEER_PASSWORD){setScreen("volunteer");setPwErr("");setPw("");}
    else if(loginMode==="admin"&&pw===ADMIN_PASSWORD){setScreen("admin");setPwErr("");setPw("");}
    else setPwErr("Incorrect password. Please try again.");
  }
  function handleLogout(){
    stopGPS();setScreen("login");setSelectedZone(null);setSearch("");setPinCoords(null);
  }

  const volAnimals=animals.filter(a=>{
    const inZone=!selectedZone||a.zone===selectedZone;
    const q=search.toLowerCase();
    return inZone&&(!search||a.name.toLowerCase().includes(q)||a.species.toLowerCase().includes(q));
  });
  const adminAnimals=animals.filter(a=>{
    const q=adminSearch.toLowerCase();
    return !adminSearch||a.name.toLowerCase().includes(q)||a.species.toLowerCase().includes(q)||a.zone.toLowerCase().includes(q);
  });

  function startAdd(){setForm({name:"",species:"",gender:"Female",birthdate:"",zone:ZONES[0],blog:"",wiki:""});setEditAnimal(null);setScreen("adminEdit");}
  function startEdit(a){setForm({name:a.name,species:a.species,gender:a.gender,birthdate:a.birthdate,zone:a.zone,blog:a.blog||"",wiki:a.wiki||""});setEditAnimal(a);setScreen("adminEdit");}
  function saveAnimal(){
    if(!form.name||!form.species||!form.birthdate)return;
    const entry={...form,blog:form.blog||null,wiki:form.wiki||null};
    if(editAnimal){setAnimals(prev=>prev.map(a=>a.id===editAnimal.id?{...a,...entry}:a));showToast("Animal updated!");}
    else{setAnimals(prev=>[...prev,{id:Math.max(...prev.map(a=>a.id))+1,...entry}]);showToast("Animal added!");}
    setScreen("admin");
  }
  function deleteAnimal(id){setAnimals(prev=>prev.filter(a=>a.id!==id));showToast("Animal removed.");}

  const inp={width:"100%",padding:"10px 12px",borderRadius:8,border:"1.5px solid #c8e6c9",fontSize:15,boxSizing:"border-box",fontFamily:"inherit",outline:"none",marginBottom:10,background:"white"};
  const btnG={background:WPZ_GREEN,color:"white",border:"none",borderRadius:8,padding:"12px 0",fontSize:15,fontWeight:"bold",cursor:"pointer",width:"100%"};
  const btnO={background:"white",color:WPZ_GREEN,border:`2px solid ${WPZ_GREEN}`,borderRadius:8,padding:"10px 0",fontSize:14,fontWeight:"bold",cursor:"pointer",width:"100%",marginTop:8};

  const gpsBtn = ()=>{
    if(gpsStatus==="idle"||gpsStatus==="error"||gpsStatus==="outside") return (
      <button onClick={startGPS} style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,background:"#1565c0",color:"white",border:"none",borderRadius:10,padding:"10px 0",fontSize:14,fontWeight:"bold",cursor:"pointer",width:"100%",marginBottom:10}}>
        📍 Find My Location
      </button>
    );
    if(gpsStatus==="loading") return (
      <button disabled style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,background:"#90a4ae",color:"white",border:"none",borderRadius:10,padding:"10px 0",fontSize:14,fontWeight:"bold",width:"100%",marginBottom:10}}>
        ⏳ Getting location...
      </button>
    );
    if(gpsStatus==="found") return (
      <button onClick={stopGPS} style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,background:"#1b5e20",color:"white",border:"none",borderRadius:10,padding:"10px 0",fontSize:14,fontWeight:"bold",cursor:"pointer",width:"100%",marginBottom:10}}>
        🔵 Tracking Location — Tap to Stop
      </button>
    );
  };

  if(screen==="login")return(
    <div style={{minHeight:"100vh",background:WPZ_GREEN,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:"white",borderRadius:20,padding:"32px 28px",maxWidth:360,width:"100%",textAlign:"center",boxShadow:"0 8px 32px rgba(0,0,0,0.18)"}}>
        <div style={{display:"flex",justifyContent:"center",marginBottom:12}}><Logo/></div>
        <div style={{fontWeight:900,fontSize:22,color:WPZ_GREEN}}>Woodland Park Zoo</div>
        <div style={{fontSize:13,color:"#666",marginBottom:20}}>Volunteer Animal Directory</div>
        <div style={{display:"flex",marginBottom:16,borderRadius:8,overflow:"hidden",border:`1.5px solid ${WPZ_GREEN}`}}>
          {["volunteer","admin"].map(m=>(
            <button key={m} onClick={()=>setLoginMode(m)} style={{flex:1,padding:"9px 0",fontSize:13,fontWeight:"bold",cursor:"pointer",border:"none",background:loginMode===m?WPZ_GREEN:"white",color:loginMode===m?"white":WPZ_GREEN}}>
              {m==="volunteer"?"🙋 Volunteer":"🔧 Admin"}
            </button>
          ))}
        </div>
        <input type="password" placeholder={`${loginMode==="volunteer"?"Volunteer":"Admin"} password`} value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleLogin()} style={inp}/>
        {pwErr&&<div style={{color:"#c62828",fontSize:13,marginBottom:8}}>{pwErr}</div>}
        <button onClick={handleLogin} style={btnG}>Sign In</button>
        <div style={{marginTop:16,fontSize:11,color:"#aaa"}}>Internal use only — Woodland Park Zoo</div>
      </div>
    </div>
  );

  if(screen==="volunteer")return(
    <div style={{minHeight:"100vh",background:"#f4faf4"}}>
      {toast&&<div style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",background:"#333",color:"white",padding:"10px 24px",borderRadius:20,zIndex:999,fontWeight:"bold",fontSize:14,whiteSpace:"nowrap"}}>{toast}</div>}
      <div style={{background:WPZ_GREEN,padding:"14px 16px",display:"flex",alignItems:"center",gap:10,position:"sticky",top:0,zIndex:10}}>
        <Logo small/><div style={{flex:1}}><div style={{color:"white",fontWeight:800,fontSize:16}}>WPZ Animal Directory</div><div style={{color:"#a5d6a7",fontSize:11}}>Volunteer Access</div></div>
        <button onClick={handleLogout} style={{background:"rgba(255,255,255,0.15)",border:"none",color:"white",borderRadius:8,padding:"6px 12px",fontSize:12,cursor:"pointer"}}>Sign Out</button>
      </div>
      <div style={{display:"flex",background:"white",borderBottom:"2px solid #e0e0e0"}}>
        {[["list","📋 Animals"],["map","🗺️ Map"]].map(([tab,label])=>(
          <button key={tab} onClick={()=>setActiveTab(tab)} style={{flex:1,padding:"11px 0",fontSize:13,fontWeight:"bold",border:"none",cursor:"pointer",background:"transparent",color:activeTab===tab?WPZ_GREEN:"#999",borderBottom:activeTab===tab?`3px solid ${WPZ_GREEN}`:"3px solid transparent"}}>{label}</button>
        ))}
      </div>

      {activeTab==="map"&&(
        <div style={{padding:"14px 16px 80px"}}>
          {gpsBtn()}
          {gpsStatus==="outside"&&<div style={{fontSize:13,color:"#e65100",marginBottom:10,textAlign:"center",background:"#fff3e0",borderRadius:8,padding:"8px"}}>📍 Your location appears to be outside the zoo</div>}
          {gpsStatus==="found"&&selectedZone&&<div style={{fontSize:13,color:"#1b5e20",marginBottom:10,textAlign:"center",background:"#e8f5e9",borderRadius:8,padding:"8px"}}>🔵 You are in: <strong>{selectedZone}</strong></div>}
          <ZoneMap selectedZone={selectedZone} onZoneSelect={z=>{setSelectedZone(z);setPinCoords(null);}} pinCoords={pinCoords} gpsCoords={gpsCoords}/>
          {selectedZone&&(<div style={{marginTop:12}}>
            <div style={{fontWeight:800,fontSize:16,color:WPZ_GREEN,marginBottom:8}}>{ZONE_EMOJI[selectedZone]} {selectedZone}</div>
            <div style={{fontSize:13,color:"#666",marginBottom:10}}>{volAnimals.length} animal{volAnimals.length!==1?"s":""} — tap for links</div>
            {volAnimals.map(a=><AnimalCard key={a.id} a={a} compact/>)}
            <button onClick={()=>{setSelectedZone(null);setPinCoords(null);if(gpsStatus==="found")stopGPS();}} style={{...btnO,marginTop:4,fontSize:13}}>Clear</button>
          </div>)}
          {!selectedZone&&(<div style={{marginTop:12}}>
            {ZONES.map(z=>{const cnt=animals.filter(a=>a.zone===z).length;const zp=ZONE_PATHS.find(p=>p.id===z);return(
              <div key={z} onClick={()=>setSelectedZone(z)} style={{display:"flex",alignItems:"center",gap:10,background:"white",borderRadius:10,padding:"10px 14px",marginBottom:8,cursor:"pointer",boxShadow:"0 1px 4px rgba(0,0,0,0.07)"}}>
                <div style={{width:16,height:16,borderRadius:4,background:zp?.color,flexShrink:0}}/><div style={{flex:1,fontWeight:600,fontSize:14}}>{ZONE_EMOJI[z]} {z}</div><div style={{fontSize:13,color:"#888"}}>{cnt} animals</div>
              </div>
            );})}
          </div>)}
        </div>
      )}

      {activeTab==="list"&&(
        <div style={{padding:"14px 16px 80px"}}>
          {gpsBtn()}
          {gpsStatus==="found"&&selectedZone&&<div style={{fontSize:13,color:"#1b5e20",marginBottom:10,textAlign:"center",background:"#e8f5e9",borderRadius:8,padding:"8px"}}>🔵 Showing animals near you: <strong>{selectedZone}</strong></div>}
          <input placeholder="🔍 Search by name or species..." value={search} onChange={e=>{setSearch(e.target.value);setSelectedZone(null);}} style={{...inp,marginBottom:12,border:"1.5px solid #c8e6c9"}}/>
          <div style={{display:"flex",gap:8,overflowX:"auto",paddingBottom:8,marginBottom:4}}>
            <button onClick={()=>{setSelectedZone(null);setSearch("");}} style={{flexShrink:0,padding:"7px 14px",borderRadius:20,border:"none",cursor:"pointer",fontSize:12,fontWeight:"bold",background:!selectedZone?WPZ_GREEN:"#e0e0e0",color:!selectedZone?"white":"#555"}}>All</button>
            {ZONES.map(z=>(<button key={z} onClick={()=>{setSelectedZone(z);setSearch("");}} style={{flexShrink:0,padding:"7px 12px",borderRadius:20,border:"none",cursor:"pointer",fontSize:12,fontWeight:"bold",background:selectedZone===z?WPZ_GREEN:"#e0e0e0",color:selectedZone===z?"white":"#555"}}>{ZONE_EMOJI[z]}</button>))}
          </div>
          {selectedZone&&<div style={{fontSize:13,color:WPZ_GREEN,fontWeight:"bold",marginBottom:6}}>{ZONE_EMOJI[selectedZone]} {selectedZone}</div>}
          <div style={{fontSize:12,color:"#888",marginBottom:8}}>{volAnimals.length} animal{volAnimals.length!==1?"s":""} — tap any card to see links</div>
          {volAnimals.length===0&&<div style={{textAlign:"center",color:"#aaa",marginTop:40}}>No animals found.</div>}
          {volAnimals.map(a=><AnimalCard key={a.id} a={a} compact={!!selectedZone}/>)}
        </div>
      )}
    </div>
  );

  if(screen==="admin")return(
    <div style={{minHeight:"100vh",background:"#f4faf4"}}>
      {toast&&<div style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",background:"#2e7d32",color:"white",padding:"10px 24px",borderRadius:20,zIndex:999,fontWeight:"bold",fontSize:14}}>{toast}</div>}
      <div style={{background:"#1b5e20",padding:"14px 16px",display:"flex",alignItems:"center",gap:10,position:"sticky",top:0,zIndex:10}}>
        <Logo small/><div style={{flex:1}}><div style={{color:"white",fontWeight:800,fontSize:16}}>Admin Panel</div><div style={{color:"#a5d6a7",fontSize:11}}>Animal Management</div></div>
        <button onClick={handleLogout} style={{background:"rgba(255,255,255,0.15)",border:"none",color:"white",borderRadius:8,padding:"6px 12px",fontSize:12,cursor:"pointer"}}>Sign Out</button>
      </div>
      <div style={{padding:"14px 16px 80px"}}>
        <button onClick={startAdd} style={{...btnG,marginBottom:12}}>+ Add New Animal</button>
        <input placeholder="🔍 Search animals..." value={adminSearch} onChange={e=>setAdminSearch(e.target.value)} style={{...inp,marginBottom:12}}/>
        <div style={{fontSize:13,color:"#666",marginBottom:8}}>{adminAnimals.length} animals total</div>
        {adminAnimals.map(a=>(
          <div key={a.id} style={{background:"white",borderRadius:12,padding:"12px 14px",marginBottom:8,boxShadow:"0 2px 6px rgba(0,0,0,0.07)",borderLeft:`4px solid ${WPZ_GREEN}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div>
                <div style={{fontWeight:800,fontSize:16,color:"#1b5e20"}}>{a.name}</div>
                <div style={{fontSize:13,color:"#555"}}>{a.species} · {a.gender} · {calcAge(a.birthdate)} yrs</div>
                <div style={{fontSize:12,color:"#888",marginTop:2}}>{ZONE_EMOJI[a.zone]} {a.zone}</div>
              </div>
              <div style={{display:"flex",gap:6,flexShrink:0}}>
                <button onClick={()=>startEdit(a)} style={{background:WPZ_GOLD,border:"none",color:"white",borderRadius:7,padding:"6px 12px",fontSize:12,fontWeight:"bold",cursor:"pointer"}}>Edit</button>
                <button onClick={()=>deleteAnimal(a.id)} style={{background:"#e53935",border:"none",color:"white",borderRadius:7,padding:"6px 10px",fontSize:12,fontWeight:"bold",cursor:"pointer"}}>✕</button>
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );

  return(
    <div style={{minHeight:"100vh",background:"#f4faf4"}}>
      <div style={{background:"#1b5e20",padding:"14px 16px",display:"flex",alignItems:"center",gap:10}}>
        <button onClick={()=>setScreen("admin")} style={{background:"rgba(255,255,255,0.15)",border:"none",color:"white",borderRadius:8,padding:"6px 10px",fontSize:14,cursor:"pointer"}}>←</button>
        <div style={{color:"white",fontWeight:800,fontSize:16}}>{editAnimal?"Edit Animal":"Add New Animal"}</div>
      </div>
      <div style={{padding:"20px 16px"}}>
        {[["Name","name","Animal name"],["Species","species","e.g. Western Lowland Gorilla"],["Zoo Blog URL","blog","https://blog.zoo.org/..."],["Wikipedia URL","wiki","https://en.wikipedia.org/wiki/..."]].map(([label,field,ph])=>(
          <div key={field}>
            <label style={{fontSize:13,color:"#555",fontWeight:"bold"}}>{label}</label>
            <input value={form[field]} onChange={e=>setForm(f=>({...f,[field]:e.target.value}))} placeholder={ph} style={inp}/>
          </div>
        ))}
        <label style={{fontSize:13,color:"#555",fontWeight:"bold"}}>Gender</label>
        <select value={form.gender} onChange={e=>setForm(f=>({...f,gender:e.target.value}))} style={inp}><option>Female</option><option>Male</option><option>Unknown</option></select>
        <label style={{fontSize:13,color:"#555",fontWeight:"bold"}}>Birthdate</label>
        <input type="date" value={form.birthdate} onChange={e=>setForm(f=>({...f,birthdate:e.target.value}))} style={inp}/>
        <label style={{fontSize:13,color:"#555",fontWeight:"bold"}}>Zone</label>
        <select value={form.zone} onChange={e=>setForm(f=>({...f,zone:e.target.value}))} style={inp}>{ZONES.map(z=><option key={z}>{z}</option>)}</select>
        <button onClick={saveAnimal} style={{...btnG,marginTop:8}} disabled={!form.name||!form.species||!form.birthdate}>{editAnimal?"Save Changes":"Add Animal"}</button>
        <button onClick={()=>setScreen("admin")} style={btnO}>Cancel</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
